<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | Elite Foot Care</title>
  
  <!-- Tipografía Google Fonts Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Iconos Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
  <!-- Estilos del Sistema de Diseño -->
  <link rel="stylesheet" href="css/design-system.css">
  
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary-accent: #38bdf8;
      --podo-accent: #c084fc;
      --recep-accent: #34d399;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.12) 0%, transparent 40%),
                  radial-gradient(circle at 80% 80%, rgba(192, 132, 252, 0.12) 0%, transparent 40%),
                  #070b14;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #f8fafc;
      overflow-x: hidden;
    }

    .login-container {
      width: 100%;
      max-width: 460px;
      padding: 1.5rem;
      z-index: 2;
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 2.75rem 2.25rem;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-icon {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(192, 132, 252, 0.2));
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--primary-accent);
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.2);
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.75rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.01em;
      margin-bottom: 0.35rem;
    }

    .brand-subtitle {
      font-size: 0.88rem;
      color: #94a3b8;
    }

    .form-group {
      margin-bottom: 1.35rem;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.5rem;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i.input-icon {
      position: absolute;
      left: 1rem;
      color: #64748b;
      font-size: 0.95rem;
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.6rem;
      background: rgba(15, 23, 42, 0.6);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.95rem;
      transition: all 0.25s ease;
      box-sizing: border-box;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary-accent);
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .btn-toggle-pass {
      position: absolute;
      right: 0.85rem;
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 0.95rem;
      padding: 0.25rem;
    }

    .btn-toggle-pass:hover {
      color: #cbd5e1;
    }

    .btn-login {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-top: 1.75rem;
      transition: all 0.25s ease;
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.35);
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(2, 132, 199, 0.5);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Error Banner */
    .error-banner {
      display: none;
      padding: 0.85rem 1rem;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 10px;
      color: #fca5a5;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      align-items: center;
      gap: 0.6rem;
    }

    .error-banner.active {
      display: flex;
    }

    /* Selector de Cuentas Demo */
    .demo-roles-divider {
      position: relative;
      text-align: center;
      margin: 2rem 0 1.25rem;
    }

    .demo-roles-divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    .demo-roles-divider span {
      position: relative;
      background: #0d1527;
      padding: 0 0.85rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .demo-chips-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.6rem;
    }

    .demo-chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 0.65rem 0.4rem;
      color: #cbd5e1;
      font-size: 0.76rem;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }

    .demo-chip i {
      font-size: 1rem;
    }

    .demo-chip.admin:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.4);
      color: #38bdf8;
    }

    .demo-chip.recep:hover {
      background: rgba(52, 211, 153, 0.15);
      border-color: rgba(52, 211, 153, 0.4);
      color: #34d399;
    }

    .demo-chip.podo:hover {
      background: rgba(192, 132, 252, 0.15);
      border-color: rgba(192, 132, 252, 0.4);
      color: #c084fc;
    }

    .login-footer-link {
      text-align: center;
      margin-top: 1.75rem;
      font-size: 0.85rem;
      color: #64748b;
    }

    .login-footer-link a {
      color: var(--primary-accent);
      text-decoration: none;
      font-weight: 600;
    }

    .login-footer-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      
      <!-- Encabezado con Icono -->
      <div class="login-header">
        <div class="brand-icon">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <div class="brand-title">Elite Foot Care</div>
        <div class="brand-subtitle">Portal de Acceso Profesional • Redirección RBAC</div>
      </div>

      <!-- Banner de Error -->
      <div id="login-error-banner" class="error-banner">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="login-error-text">Credenciales incorrectas</span>
      </div>

      <!-- Formulario de Acceso -->
      <form id="form-login">
        <div class="form-group">
          <label class="form-label" for="input-email">Correo Electrónico</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input type="email" id="input-email" class="form-input" placeholder="usuario@elitefoot.com" required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="input-password">Contraseña</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="input-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="btn-toggle-pass" id="btn-toggle-password" aria-label="Mostrar contraseña">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="btn-submit-login" class="btn-login">
          <span>Iniciar Sesión</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <!-- Botones de Demostración y Prueba Rápida de Roles -->
      <div class="demo-roles-divider">
        <span>Prueba Rápida por Rol</span>
      </div>

      <div class="demo-chips-grid">
        <div class="demo-chip admin" onclick="cargarCredenciales('admin@elitefoot.com', 'admin123', 'admin')">
          <i class="fa-solid fa-user-shield" style="color: #38bdf8;"></i>
          <span>Admin</span>
        </div>
        <div class="demo-chip recep" onclick="cargarCredenciales('recepcion@elitefoot.com', 'recep123', 'recep')">
          <i class="fa-solid fa-cash-register" style="color: #34d399;"></i>
          <span>Recepción</span>
        </div>
        <div class="demo-chip podo" onclick="cargarCredenciales('angelhernandez@gmail.com', 'angel1234', 'podo')">
          <i class="fa-solid fa-stethoscope" style="color: #c084fc;"></i>
          <span>Podólogo</span>
        </div>
      </div>

      <!-- Enlace a la Landing de Pacientes -->
      <div class="login-footer-link">
        ¿Eres un paciente? <a href="/frontend-landing/src/index.html">Ir a la Web de Citas</a>
      </div>

    </div>
  </div>

  <!-- Contenedor Toast -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="js/session.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Si ya hay una sesión activa, derivarlo automáticamente a su vista
      const currentUser = AppAuth.getCurrentUser();
      if (currentUser && currentUser.fk_rol_id) {
        AppAuth.showToast(`Sesión detectada como ${currentUser.nombre_rol || 'Usuario'}. Redirigiendo...`, 'info');
        setTimeout(() => {
          AppAuth.redirectByRole(currentUser);
        }, 800);
      }

      // Alternar visualización de contraseña
      const btnToggle = document.getElementById('btn-toggle-password');
      const passInput = document.getElementById('input-password');
      btnToggle?.addEventListener('click', () => {
        const isPass = passInput.type === 'password';
        passInput.type = isPass ? 'text' : 'password';
        btnToggle.querySelector('i').className = isPass ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
      });

      // Manejar envío del formulario
      const form = document.getElementById('form-login');
      const submitBtn = document.getElementById('btn-submit-login');
      const errorBanner = document.getElementById('login-error-banner');
      const errorText = document.getElementById('login-error-text');

      form?.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBanner.classList.remove('active');

        const email = document.getElementById('input-email').value.trim();
        const password = document.getElementById('input-password').value;

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Validando credenciales...';

        const result = await AppAuth.login(email, password);

        if (result.ok && result.usuario) {
          const u = result.usuario;
          const rolTexto = u.nombre_rol || u.rol || 'Especialista';
          AppAuth.showToast(`¡Acceso concedido! Bienvenido(a) ${u.perfil?.Nombre || u.email}. Derivando a tu módulo (${rolTexto})...`, 'success');

          // REDIRECCIÓN INTELIGENTE SEGÚN EL ROL
          setTimeout(() => {
            AppAuth.redirectByRole(u);
          }, 600);
        } else {
          errorText.textContent = result.error || 'Credenciales inválidas. Verifica tu correo y contraseña.';
          errorBanner.classList.add('active');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Iniciar Sesión</span> <i class="fa-solid fa-arrow-right"></i>';
        }
      });
    });

    // Carga automática para pruebas de los 3 roles
    function cargarCredenciales(email, pass, roleName) {
      document.getElementById('input-email').value = email;
      document.getElementById('input-password').value = pass;
      document.getElementById('login-error-banner').classList.remove('active');
      document.getElementById('btn-submit-login').click();
    }
  </script>
</body>
</html>
