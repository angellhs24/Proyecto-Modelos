name: CI/CD Pipeline

on:
  push:
    branches: [ main, new-structure ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    name: Backend Lint & Health Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar Dependencias Backend
        run: npm ci

      - name: Verificación de Sintaxis
        run: |
          node --check src/app.js
          node --check src/server.js

  frontend-admin-checks:
    name: Frontend Admin Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-admin
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-admin/package-lock.json

      - name: Instalar Dependencias Frontend Admin
        run: npm ci

      - name: Ejecutar Pruebas Unitarias
        run: npm run test:unit
